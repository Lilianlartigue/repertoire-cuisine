name: Vérification du site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/neondb
          GEMINI_API_KEY: build-placeholder
          GEMINI_MODEL: gemini-3.8-flash
